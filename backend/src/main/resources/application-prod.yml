server:
  port: 8080

spring:
  mvc:
    async:
      request-timeout: 1800000

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smartdoc?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.smartdoc: INFO
    org.springframework.web: WARN
  file:
    path: ${LOG_PATH:/var/log/smartdoc}

smartdoc:
  audit:
    timeout: 120
    temperature: 0.1
    max-file-size: 52428800