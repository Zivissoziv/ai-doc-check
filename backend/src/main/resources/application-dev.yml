server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smartdoc?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.smartdoc: DEBUG
    org.springframework.web: DEBUG
  file:
    path: ./logs

smartdoc:
  audit:
    timeout: 120
    temperature: 0.1
    max-file-size: 52428800