# =========================================
# SmartDoc 生产环境外部配置文件
# 将此文件放在 JAR 同目录的 config/ 下
# Spring Boot 会自动加载，优先级高于 jar 内的配置
# =========================================

# ----- 服务器端口 -----
server.port=8080

# ----- 数据库连接（按需修改） -----
spring.datasource.url=jdbc:mysql://localhost:3306/smartdoc?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=ENC(TG2jyrZtnn6L3usxFm9UYg==)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----- 加解密配置（密钥文件权限建议设为 600） -----
smartdoc.secret-key=SmartDoc2024!

# ----- MyBatis-Plus 配置 -----
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl

# ----- 日志配置 -----
logging.level.com.smartdoc=INFO
logging.level.org.springframework.web=WARN
logging.file.path=./logs

# ----- AI 审核参数 -----
smartdoc.audit.timeout=120
smartdoc.audit.temperature=0.1
smartdoc.audit.max-file-size=52428800
